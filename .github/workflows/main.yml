name: CI devops 2026
on:
  #to begin you want to launch this job in main and develop
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      #checkout your github code using actions/checkout@v4
      - uses: actions/checkout@v4

      #do the same with another action (actions/setup-java@v4) that enable to setup jdk 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      #finally build your app with the latest command
      - name: Build and test with Maven
        working-directory: simple-api
        run: mvn clean verify

  build-docker-images:
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          tags: ${{ github.ref == 'refs/heads/main' && format('{0}/tp-devops-simple-api:latest', secrets.DOCKERHUB_USERNAME) || 'tp-devops-simple-api:ci' }}
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Build database image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ github.ref == 'refs/heads/main' && format('{0}/tp-devops-database:latest', secrets.DOCKERHUB_USERNAME) || 'tp-devops-database:ci' }}
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Build httpd image
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ github.ref == 'refs/heads/main' && format('{0}/tp-devops-httpd:latest', secrets.DOCKERHUB_USERNAME) || 'tp-devops-httpd:ci' }}
          push: ${{ github.ref == 'refs/heads/main' }}
