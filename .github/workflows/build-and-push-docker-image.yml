name: build-and-push-docker-image

on:
  workflow_run:
    workflows: ["test-backend"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-push-docker-image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout frontend source
        uses: actions/checkout@v4
        with:
          repository: takima-training/devops-front
          ref: 62fc7baa2af69d070b83771da46545d70553f355
          path: devops-front

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:sha-${{ github.event.workflow_run.head_sha }}
          push: true

      - name: Build and push database image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:sha-${{ github.event.workflow_run.head_sha }}
          push: true

      - name: Build and push httpd image
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:sha-${{ github.event.workflow_run.head_sha }}
          push: true

      - name: Configure frontend API URL
        run: printf '%s\n' 'VUE_APP_API_URL=gabriel.combe.takima.school/api' > devops-front/.env.production

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./devops-front
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-front:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-front:sha-${{ github.event.workflow_run.head_sha }}
          push: true

      - name: Set up Python for Ansible
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible and Docker collection
        run: |
          python -m pip install ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Configure deployment SSH and Vault credentials
        env:
          DEPLOY_SSH_PRIVATE_KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY_B64"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$ANSIBLE_VAULT_PASSWORD"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s' "$DEPLOY_SSH_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$RUNNER_TEMP/vault_password"
          chmod 600 "$RUNNER_TEMP/vault_password"

      - name: Deploy application with Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
        run: >-
          ansible-playbook
          -i ansible/inventories/setup.yml
          ansible/deploy.yml
          --private-key "$RUNNER_TEMP/deploy_key"
          --vault-password-file "$RUNNER_TEMP/vault_password"
          -e docker_image_tag=sha-${{ github.event.workflow_run.head_sha }}
