---
- name: Start the Spring Boot API
  community.docker.docker_container:
    name: simple-api
    image: "{{ dockerhub_username }}/tp-devops-simple-api:{{ docker_image_tag | default('latest') }}"
    pull: true
    state: started
    restart_policy: unless-stopped
    env:
      DATABASE_HOST: database
      DATABASE_PASSWORD: "{{ vault_postgres_password }}"
    networks:
      - name: my-network
